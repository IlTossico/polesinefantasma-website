{{ $map := resources.Get "images/il-polesine.jpg" | fingerprint }}
<div class="history-rail">
  <div class="history-corner">
    <a class="history-link" href="https://it.wikipedia.org/wiki/Polesine" target="_blank" rel="noopener noreferrer" aria-label="La storia del Polesine su Wikipedia (si apre in una nuova scheda)" aria-describedby="history-tooltip">
      <span class="history-art"><span class="history-fold"><img class="history-photo" src="{{ $map.RelPermalink }}" width="750" height="514" alt="" decoding="async"></span></span>
      <span class="history-label" aria-hidden="true">La Storia</span>
    </a>
    <span class="history-tooltip" id="history-tooltip" role="tooltip">La storia del Polesine</span>
  </div>
</div>
