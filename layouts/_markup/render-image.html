{{ $image := or (.Page.Resources.GetMatch .Destination) (resources.Get .Destination) }}
{{ if $image }}
  {{ $data := partial "hero-image-data.html" $image }}
  <img src="{{ $data.src }}" srcset="{{ $data.srcset }}" sizes="(min-width: 960px) 880px, 100vw" width="{{ $data.width }}" height="{{ $data.height }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
{{ else }}
  <img src="{{ .Destination | safeURL }}" alt="{{ .PlainText }}"{{ with .Title }} title="{{ . }}"{{ end }} loading="lazy" decoding="async">
{{ end }}
{{ if eq .Page.Section "esplora" }}
  {{ with or .Title .PlainText }}<span class="image-caption">{{ . }}</span>{{ end }}
{{ end }}
